<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#cdeca9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="刷牙计时" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>刷牙计时</title>
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=47" />
  </head>
  <body>
    <svg class="sprite" aria-hidden="true">
      <symbol id="icon-home" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></symbol>
      <symbol id="icon-record" viewBox="0 0 24 24"><path d="M6 5h12v15H6z"/><path d="M9 9h6M9 13h6M9 17h4"/></symbol>
      <symbol id="icon-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M4.2 7.5l2.6 1.5M17.2 15l2.6 1.5M19.8 7.5 17.2 9M6.8 15l-2.6 1.5"/></symbol>
      <symbol id="icon-play" viewBox="0 0 24 24"><path d="M9 6v12l10-6z"/></symbol>
      <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 13 4 4L19 7"/></symbol>
      <symbol id="icon-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
      <symbol id="icon-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
      <symbol id="icon-trophy" viewBox="0 0 24 24"><path d="M8 5h8v4a4 4 0 0 1-8 0z"/><path d="M8 7H5a3 3 0 0 0 3 4M16 7h3a3 3 0 0 1-3 4M12 13v4M9 21h6M10 17h4"/></symbol>
      <symbol id="icon-smile-tooth" viewBox="0 0 24 24"><path d="M8.8 3.8c-3-.5-5.3 1.7-5 5 .2 2.8 1.5 5.1 3.2 7.2 1 1.2 2.4.8 2.7-.8l.6-3.4c.2-1.1 1.6-1.1 1.8 0l.7 3.8c.3 1.5 2.2 1.7 3.1.4 1.7-2.4 3-4.7 3.2-7.4.2-3.4-2.3-5.6-5.5-4.6-1.5.5-3 .5-4.8-.2z"/><path d="M8.2 9.8h.1M14.8 9.8h.1M9.3 12.7c1.4 1.3 3.8 1.3 5.2 0"/></symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M19.8 4.2l-2.1 2.1M6.3 17.7l-2.1 2.1"/></symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M6 14a6 6 0 0 0 9 5.2A8 8 0 0 1 13 4a6 6 0 0 0-7 10z"/></symbol>
    </svg>

    <main class="app">
      <section class="view active" data-view="checkin">
        <header class="hero">
          <div class="hero-top">
            <span id="todayText"></span>
            <span id="sessionLabel">早晚各一次</span>
          </div>

          <section class="brush-stage" aria-live="polite" hidden>
            <svg class="tooth-scene" viewBox="0 0 320 250" role="img" aria-label="牙齿和牙刷动画">
              <path class="cloud cloud-a" d="M32 44c8-14 34-14 43 0 14-4 29 5 31 20H10c-2-12 8-21 22-20z"/>
              <path class="cloud cloud-b" d="M235 55c7-13 28-13 36 0 13-3 26 5 29 18h-82c-1-10 6-18 17-18z"/>
              <g class="sparkles">
                <path d="M70 92v12M64 98h12M255 95v12M249 101h12"/>
              </g>
              <g class="tooth-wrap">
                <path id="toothShape" class="tooth" d="M109 91c-25-4-44 14-42 42 1 23 12 41 26 58 8 10 18 7 20-5l5-30c2-9 13-9 15 0l6 34c2 11 17 13 24 3 14-20 24-39 25-62 2-29-20-47-47-39-11 3-20 3-32-1z"/>
                <path class="tooth-shine" d="M92 121c5-13 15-19 31-17"/>
                <circle class="eye" cx="117" cy="135" r="4"/>
                <circle class="eye" cx="143" cy="135" r="4"/>
                <path class="mouth" d="M123 151c7 7 18 7 25 0"/>
                <path class="cheek" d="M100 148h10M151 148h10"/>
                <path class="highlight-zone" id="highlightZone" d="M83 113c15-12 38-13 58-4" />
              </g>
              <g class="brush" id="brushSvg">
                <path class="brush-handle" d="M202 72l75 42c8 5 9 16 2 22-6 6-15 6-22 0l-66-54z"/>
                <path class="brush-neck" d="M178 82l27-16 11 22-30 13z"/>
                <rect class="brush-head" x="150" y="74" width="38" height="28" rx="8" transform="rotate(-22 169 88)"/>
                <path class="bristles" d="M151 83l-18 8M156 91l-19 9M162 98l-17 8"/>
              </g>
            </svg>
          </section>
        </header>

        <section class="timer-card">
          <div class="timer-ring no-progress">
            <svg class="timer-progress" viewBox="-80 -80 440 440" aria-hidden="true">
              <circle class="timer-track" cx="140" cy="140" r="190"></circle>
              <path class="timer-value" d=""></path>
            </svg>
            <div>
              <strong id="timeLeft">00:00</strong>
              <span id="stepTimeLeft">本步 20s</span>
            </div>
          </div>
          <div class="timer-copy">
            <p id="stepIndex">第 1 / 7 步</p>
            <h1 id="stepTitle">上排外侧</h1>
            <p id="stepHint">牙刷轻轻打圈，照顾到牙龈边缘。</p>
          </div>
        </section>

        <section class="controls">
          <button class="primary-action" id="startButton" type="button"><span>开始刷牙</span></button>
        </section>
      </section>

      <section class="view data-view" data-view="data">
        <section class="panel stats-panel">
          <div class="stat-card stat-card-streak">
            <div class="stat-content">
              <span>连续完成</span>
              <strong id="streakCount">0 天</strong>
            </div>
          </div>
          <div class="stat-card stat-card-total">
            <div class="stat-content">
              <span>总完成</span>
              <strong id="totalCount">0 次</strong>
              <small>累计打卡</small>
            </div>
            <span class="stat-icon"><svg><use href="#icon-smile-tooth"></use></svg></span>
          </div>
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>历史记录</h2>
            <button id="clearRecords" type="button">清空</button>
          </div>
          <div class="calendar" id="calendarView"></div>
          <div class="records-list" id="recordsList"></div>
        </section>
      </section>

      <section class="view mine-view" data-view="mine">
        <section class="panel">
          <div class="panel-head">
            <h2>刷牙设置</h2>
          </div>
          <div class="setting-group">
            <h3>刷牙时间</h3>
            <div class="radio-list" id="durationOptions">
              <label class="radio-row">
                <input type="radio" name="brushDuration" value="2" />
                <span>
                  <strong>2 分钟</strong>
                  <small>标准刷牙时长</small>
                </span>
              </label>
              <label class="radio-row">
                <input type="radio" name="brushDuration" value="3" />
                <span>
                  <strong>3 分钟</strong>
                  <small>更充分清洁</small>
                </span>
              </label>
            </div>
          </div>

          <div class="setting-group">
            <h3>提醒时间</h3>
            <div class="radio-grid" id="reminderOptions">
              <label class="radio-pill"><input type="radio" name="reminderPeriod" value="morning" /><span>早上</span></label>
              <label class="radio-pill"><input type="radio" name="reminderPeriod" value="noon" /><span>中午</span></label>
              <label class="radio-pill"><input type="radio" name="reminderPeriod" value="night" /><span>晚上</span></label>
            </div>
            <p class="setting-note">12 点以前算早上，12 点到 17 点算中午，17 点以后算晚上。</p>
          </div>

          <div class="setting-group">
            <h3>刷牙顺序</h3>
            <div class="order-list" id="orderList"></div>
          </div>
        </section>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="底部导航">
      <button class="active" data-tab="checkin" type="button"><span><svg><use href="#icon-home"></use></svg></span>打卡</button>
      <button data-tab="data" type="button"><span><svg><use href="#icon-record"></use></svg></span>数据</button>
      <button data-tab="mine" type="button"><span><svg><use href="#icon-settings"></use></svg></span>我的</button>
    </nav>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./script.js?v=47"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js", { updateViaCache: "none" }).catch(() => {});
        });

        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (sessionStorage.getItem("sw-refreshing")) return;
          sessionStorage.setItem("sw-refreshing", "1");
          window.location.reload();
        });
      }
    </script>
  </body>
</html>
